name: Bug report
description: Something did the wrong thing, or failed.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before you paste anything: `doctor --json` includes absolute paths to your
        media. Trim them if you would rather not publish them — the codes and the
        structure are the useful part.

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The behaviour, not the diagnosis. One or two sentences.
      placeholder: A file was quarantined but the library still shows the original.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: input
    id: code
    attributes:
      label: Error or reason code
      description: The `E_*` or `R_*` code from the log, the CLI or the dashboard.
      placeholder: E_VERIFY_VMAF

  - type: textarea
    id: doctor
    attributes:
      label: doctor output
      description: The output of `messer-transcode doctor --json` (or the plain text version).
      render: json
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: From the node (`pm2 logs transcode-node`) or the orchestrator (`docker logs transcode`).
      render: shell

  - type: dropdown
    id: hardware
    attributes:
      label: Hardware
      description: The encoder is the whole reason the worker runs on the host, so this matters.
      options:
        - Apple silicon (M1/M2/M3/M4)
        - Intel Mac
        - Linux (worker)
        - Other / not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `messer-transcode version`.
      placeholder: 1.0.0 (a1b2c3d, built 2026-11-07T12:00:00Z, go1.26)
    validations:
      required: true
