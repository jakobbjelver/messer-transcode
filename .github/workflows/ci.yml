name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: cd web/app && npm ci
      - run: cd web/app && npm test
      # Produces web/app/dist, which the Go binary embeds.
      - run: cd web/app && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/app/dist

  test:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The binary embeds web/app/dist: `go vet` and `go test` cannot run without
      # it (pattern all:app/dist: no matching files).
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/app/dist
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/app/dist
      # v8 of the action ships golangci-lint v2, which is built with a Go
      # toolchain new enough to target this module's go directive. v6 shipped
      # 1.64 (built with go1.24) and refused to run.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: false
          # Without load the image only exists in the buildx cache, and the
          # "image runs" step below would have nothing to run.
          load: true
          tags: messer-transcode:ci
          # github.sha is a hex digest supplied by GitHub, not free text, and it
          # is passed as a build arg rather than interpolated into a shell.
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
      - name: image runs
        run: docker run --rm messer-transcode:ci version
