name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/app/package-lock.json
      - run: cd web/app && npm ci
      - run: cd web/app && npm test
      # Produces web/app/dist, which the Go binary embeds.
      - run: cd web/app && npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/app/dist

  test:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The binary embeds web/app/dist: `go vet` and `go test` cannot run without
      # it (pattern all:app/dist: no matching files).
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/app/dist
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "gofmt needed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/app/dist
      # v8 of the action ships golangci-lint v2, which is built with a Go
      # toolchain new enough to target this module's go directive. v6 shipped
      # 1.64 (built with go1.24) and refused to run.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest

  # The image build lives in image.yml, which runs on the same push and publishes what it
  # builds. This job built the same Dockerfile a second time just to `docker run version`
  # it: two runs of the same build, ~2 minutes of runner time, per commit. A broken
  # Dockerfile still fails loudly — image.yml goes red and nothing is published.
