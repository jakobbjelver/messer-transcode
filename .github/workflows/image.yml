name: image

# Builds the orchestrator container and publishes it to GHCR, so the stack pulls
# a versioned image instead of relying on one built by hand on this machine.
#
# The same pattern as server-portal and messer-request-games: GITHUB_TOKEN with
# packages: write, linux/arm64 only (the only architecture this runs on), and a
# commit-sha tag beside latest so a deployment can be pinned and rolled back.

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A 40-char sha is a bad build stamp: it is the string the UI renders, and
      # in a 390px column it widened the whole settings page. A tag still wins;
      # otherwise the short sha is what a human reads.
      - name: Short sha
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          platforms: linux/arm64
          provenance: false
          sbom: false
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || steps.sha.outputs.short }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || '' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
